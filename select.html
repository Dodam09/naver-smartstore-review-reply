<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 자동답글 · 리뷰 답글</title>
  <link rel="stylesheet" href="lib/app-shell.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      color: #1a1a1a;
      background: #eef1f5;
    }
    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: stretch;
    }
    .side {
      width: 340px;
      flex: 0 0 340px;
      min-height: 0;
      overflow: hidden;
      background: #fff;
      border-left: 1px solid #dde2e8;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .side:has(#reviewToolbar:not([hidden])) .gen-progress.success,
    .side:has(#reviewToolbar:not([hidden])) .gen-progress.stopped {
      display: none;
    }
    .header {
      flex-shrink: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid #dde2e8;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .header-inner {
      margin: 0;
      padding: 14px 20px 0;
    }
    .header h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 800;
    }
    .header .sub {
      margin: 0 0 16px;
      color: #666;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin: 0 -4px;
    }
    .tab {
      padding: 12px 20px;
      border: none;
      border-radius: 10px 10px 0 0;
      background: transparent;
      color: #666;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      transition: color .15s, background .15s;
    }
    .tab:hover {
      color: #333;
      background: #f8faf9;
    }
    .tab.active {
      color: #0a7a3f;
      background: #f6fdf9;
      border-bottom-color: #03c75a;
    }
    .tab.locked {
      opacity: .45;
      cursor: not-allowed;
    }
    .tab .badge {
      display: inline-block;
      min-width: 20px;
      padding: 2px 7px;
      margin-left: 6px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #e5e7eb;
      color: #555;
    }
    .tab.active .badge {
      background: #03c75a;
      color: #fff;
    }
    .panel-toolbar {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-toolbar[hidden] { display: none !important; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0;
    }
    .stat-box {
      background: #f8faf9;
      border: 1px solid #d8ebe0;
      border-radius: 12px;
      padding: 12px 14px;
      min-width: 0;
    }
    .stats .stat-box:last-child { grid-column: 1 / -1; }
    .stat-box .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    .stat-box .value {
      font-size: 18px;
      font-weight: 800;
      color: #0a7a3f;
    }
    .stat-box.selected .value { color: #2563eb; }
    .stat-box.warn .value { color: #b45309; }
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
    }
    .search {
      width: 100%;
      min-width: 0;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
    }
    .search:focus {
      outline: none;
      border-color: #03c75a;
      box-shadow: 0 0 0 3px rgba(3,199,90,.15);
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
    }
    button.primary {
      background: #03c75a;
      color: #fff;
      font-size: 16px;
      padding: 14px 24px;
    }
    button.submit-bulk {
      background: #0a7a3f;
      color: #fff;
      font-size: 15px;
      padding: 14px 20px;
    }
    button.submit-bulk:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    button.stop {
      background: #fff;
      color: #dc2626;
      border: 2px solid #dc2626;
      font-size: 15px;
      padding: 12px 20px;
    }
    button.stop:hover:not(:disabled) {
      background: #fef2f2;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    button.primary:disabled {
      background: #94a3b8;
      color: #fff;
      opacity: 1;
    }
    .usage-notice {
      width: 100%;
      margin: 0 0 12px;
      padding: 0 0 12px;
      border: none;
      border-bottom: 1px solid #eef1f4;
      border-radius: 0;
      background: transparent;
      font-size: 13px;
      line-height: 1.55;
      color: #334155;
    }
    .usage-notice.hidden { display: none; }
    .usage-notice.ok {
      background: transparent;
      border: none;
      border-bottom: 1px solid #eef1f4;
      color: #334155;
    }
    .usage-notice.warn {
      background: #fff4e5;
      border: 1px solid #f0d9a8;
      color: #9a6700;
    }
    .usage-notice.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }
    .banner {
      margin: 0;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .banner.info {
      background: #eef8f2;
      border: 1px solid #b8e6cc;
      color: #0a5c32;
    }
    .banner.success {
      background: #e8f4fd;
      border: 1px solid #b3d9f2;
      color: #0c4a6e;
    }
    .banner.warn {
      background: #fff4e5;
      border: 1px solid #f0d9a8;
      color: #9a6700;
    }
    .gen-progress {
      width: 100%;
      margin: 0;
      padding: 14px 16px;
      background: #f0f9ff;
      border: 1px solid #b3d9f2;
      border-radius: 12px;
    }
    .gen-progress.hidden { display: none; }
    .gen-progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .gen-progress-top .count {
      font-size: 20px;
      color: #2563eb;
    }
    .gen-progress-track {
      height: 12px;
      background: #dbeafe;
      border-radius: 999px;
      overflow: hidden;
    }
    .gen-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #03c75a, #22c55e);
      border-radius: 999px;
      transition: width 0.35s ease;
    }
    .gen-progress-sub {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
    }
    .gen-progress.success {
      background: #eef8f2;
      border-color: #b8e6cc;
    }
    .gen-progress.error {
      background: #fff4e5;
      border-color: #f0d9a8;
    }
    .gen-progress.stopped {
      background: #fefce8;
      border-color: #fde047;
    }
    .main {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      margin: 0;
      overflow: auto;
      padding: 16px 20px 28px;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      display: flex;
      gap: 16px;
      background: #fff;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 12px;
      transition: border-color .15s, box-shadow .15s;
    }
    .card.selectable {
      cursor: pointer;
    }
    .card.selectable:hover {
      border-color: #b8e6cc;
      box-shadow: 0 4px 14px rgba(0,0,0,.05);
    }
    .card.selected {
      border-color: #03c75a;
      background: #f6fdf9;
      box-shadow: 0 4px 16px rgba(3,199,90,.12);
    }
    .card.review-card {
      display: block;
      cursor: default;
    }
    .card-check {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      margin-top: 4px;
      accent-color: #03c75a;
      cursor: pointer;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }
    .card-id {
      font-size: 16px;
      font-weight: 800;
      color: #0a7a3f;
    }
    .card-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #f3f4f6;
      color: #555;
    }
    .badge.rating {
      background: #fff8e6;
      color: #b45309;
    }
    .card-product {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .card-content {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .review-box {
      background: #f8faf9;
      border: 1px solid #d8ebe0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.6;
      color: #444;
      white-space: pre-wrap;
    }
    .reply-label {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 14px;
      color: #333;
    }
    .reply-input {
      width: 100%;
      min-height: 96px;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
    }
    .reply-input:focus {
      outline: none;
      border-color: #03c75a;
      box-shadow: 0 0 0 3px rgba(3,199,90,.15);
    }
    .card.review-card.submitted {
      border-color: #93c5fd;
      background: #f8fafc;
      opacity: .85;
    }
    .badge.done {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .badge.unanswered {
      background: #fff4e5;
      color: #9a6700;
    }
    .badge.wait {
      background: #f3f4f6;
      color: #64748b;
    }
    .char-count {
      text-align: right;
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }
    .empty {
      text-align: center;
      padding: 80px 24px;
      color: #888;
      font-size: 16px;
      line-height: 1.6;
    }
    .footer-inner .summary {
      flex: 1;
      font-size: 15px;
      min-width: 0;
      line-height: 1.5;
    }
    .footer-inner .summary strong {
      color: #2563eb;
      font-size: 20px;
    }
    .footer-select {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      width: 100%;
      margin-top: auto;
    }
    .footer-select.hidden { display: none; }
    .footer-review {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .footer-review.active { display: flex; margin-top: auto; }
    .footer-review .summary {
      flex: none;
      width: 100%;
      padding: 8px 10px;
      background: #f4fbf7;
      border: 1px solid #d8ebe0;
      border-radius: 10px;
      font-size: 13px;
    }
    .footer-actions {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .side button.primary,
    .side button.secondary,
    .side button.submit-bulk,
    .side button.stop {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
    }
    @media (max-width: 860px) {
      .workspace { flex-direction: column; }
      .main { order: 1; }
      .side {
        order: 2;
        width: auto;
        flex: 0 0 auto;
        max-height: 46vh;
        overflow: auto;
        border-left: none;
        border-top: 1px solid #dde2e8;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="app-brand theme-review">
        <span class="app-brand-mark">
          <span class="app-brand-dot" aria-hidden="true"></span>
          <span class="app-brand-name">스마트스토어 AI 자동답글</span>
          <span class="app-brand-sep">·</span>
          <span class="app-brand-page">리뷰 답글</span>
        </span>
        <span class="app-brand-actions">
          <button type="button" class="app-brand-back" data-open-side-panel>사이드 패널로</button>
        </span>
      </div>
      <h1>리뷰 답글 만들기</h1>
      <p class="sub">골라서 답 만들기 → 확인하고 판매자센터에 올리기</p>
      <div class="usage-notice hidden" id="usageNotice"></div>
      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" id="tabSelect" role="tab" aria-selected="true">① 골라 답 만들기</button>
        <button type="button" class="tab" id="tabReview" role="tab" aria-selected="false">
          ② 확인하고 올리기 <span class="badge" id="reviewBadge" hidden>0</span>
        </button>
      </nav>
    </div>
  </header>

  <div class="workspace">
  <main class="main">
    <section class="panel active" id="panelSelect" role="tabpanel">
      <div id="selectList"></div>
    </section>
    <section class="panel" id="panelReview" role="tabpanel">
      <div id="reviewList"></div>
    </section>
  </main>

  <aside class="side">
  <div class="panel-toolbar" id="selectToolbar">
    <div class="stats">
      <div class="stat-box">
        <div class="label">전체 리뷰</div>
        <div class="value" id="totalCount">0</div>
      </div>
      <div class="stat-box selected">
        <div class="label">선택됨</div>
        <div class="value" id="selectedCount">0</div>
      </div>
      <div class="stat-box">
        <div class="label">파일</div>
        <div class="value" id="fileName" style="font-size:14px;color:#333;">-</div>
      </div>
    </div>
    <div class="toolbar">
      <input type="search" class="search" id="searchInput" placeholder="글번호, 상품명, 리뷰 내용 검색..." />
      <button type="button" class="secondary" id="selectAllBtn">전체 선택</button>
      <button type="button" class="secondary" id="selectNoneBtn">전체 해제</button>
    </div>
  </div>

  <div class="panel-toolbar" id="reviewToolbar" hidden>
    <div class="stats">
      <div class="stat-box">
        <div class="label">답글 만든 개수</div>
        <div class="value" id="draftTotal">0</div>
      </div>
      <div class="stat-box selected">
        <div class="label">내용 채운 개수</div>
        <div class="value" id="draftFilled">0</div>
      </div>
      <div class="stat-box warn" id="applyStatBox">
        <div class="label">답변 완료</div>
        <div class="value" id="applyStatus" style="font-size:14px;color:#333;">미확인</div>
      </div>
    </div>
  </div>

  <div id="banner" class="banner info" hidden></div>

      <div class="gen-progress hidden" id="genProgress">
        <div class="gen-progress-top">
          <span id="genStatusText">답글 만드는 중</span>
          <span class="count" id="genCountText">0 / 0</span>
        </div>
        <div class="gen-progress-track">
          <div class="gen-progress-fill" id="genProgressFill"></div>
        </div>
        <div class="gen-progress-sub" id="genSubText"></div>
      </div>

      <div class="footer-select" id="footerSelect">
        <div class="summary"><strong id="footerCount">0</strong>건 선택</div>
        <button type="button" class="stop" id="stopBtn" hidden>멈추기</button>
        <button type="button" class="primary" id="generateBtn" disabled>AI로 답글 만들기</button>
      </div>

      <div class="footer-review" id="footerReview">
        <div class="summary" id="reviewSummary">답글을 읽고 필요하면 고친 뒤, 판매자센터에 올리세요.</div>
        <div class="footer-actions">
          <button type="button" class="secondary" id="saveDraftBtn">잠깐 저장</button>
          <button type="button" class="secondary" id="confirmBtn" disabled>답변란에 자동 채우기</button>
          <button type="button" class="submit-bulk" id="bulkSubmitBtn" disabled>한 번에 올리기</button>
        </div>
      </div>
  </aside>
  </div>

  <script src="config.js"></script>
  <script src="lib/app-shell.js"></script>
  <script src="lib/ai-proxy.js"></script>
  <script src="lib/tone-presets.js"></script>
  <script src="select.js"></script>
</body>
</html>
