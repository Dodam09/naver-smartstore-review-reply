<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카카오 로그인</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #111827;
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p {
      margin: 0;
      line-height: 1.6;
      color: #4b5563;
      font-size: 14px;
    }
    .ok { color: #047857; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">로그인 처리 중</h1>
    <p id="message">잠시만 기다려 주세요.</p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      const token = params.get('token');
      const title = document.getElementById('title');
      const message = document.getElementById('message');

      if (error) {
        title.textContent = '로그인 실패';
        title.className = 'error';
        message.textContent = decodeURIComponent(error);
        message.className = 'error';
        return;
      }

      if (token) {
        title.textContent = '로그인 완료';
        title.className = 'ok';
        message.textContent = '확장 프로그램으로 돌아갑니다. 이 창은 자동으로 닫힙니다.';
        message.className = 'ok';
        return;
      }

      title.textContent = '로그인 정보 없음';
      title.className = 'error';
      message.textContent = '다시 시도해 주세요.';
      message.className = 'error';
    })();
  </script>
</body>
</html>
