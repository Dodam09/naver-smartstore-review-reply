<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 등록 완료</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #222;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7ef;
      border-radius: 12px;
      padding: 20px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .error { border-color: #ffb4b4; background: #fff5f5; color: #b00020; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="status">처리 중…</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const statusEl = document.getElementById('status');
    const authKey = params.get('authKey');
    const customerKey = params.get('customerKey');
    const orderId = params.get('orderId');
    const mode = params.get('mode') || 'subscribe';
    const token = sessionStorage.getItem('billingToken') || '';

    async function postJson(path, body) {
      const response = await fetch(path, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify(body),
      });
      const raw = await response.text();
      let data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch (_) {}
      if (!response.ok || data.ok === false) {
        throw new Error(data.error || `처리 실패 (${response.status})`);
      }
      return data;
    }

    async function run() {
      if (!token) throw new Error('로그인 정보가 없습니다. 확장프로그램에서 다시 시도해 주세요.');
      if (!authKey || !customerKey) {
        throw new Error('등록 정보가 올바르지 않습니다.');
      }

      if (mode === 'card-update') {
        return postJson('/api/billing/confirm-card-update', { authKey, customerKey });
      }

      if (!orderId) throw new Error('주문 정보가 올바르지 않습니다.');
      return postJson('/api/billing/confirm-billing-auth', { authKey, customerKey, orderId });
    }

    run()
      .then((data) => {
        if (mode === 'card-update') {
          statusEl.textContent =
            `결제 수단이 변경되었습니다.\n\n플랜: ${data.user.plan.name}\n만료: ${data.user.subscription.expiresAt || '-'}\n\n확장프로그램 [설정] 탭을 다시 열면 반영됩니다.\n이 창은 닫아도 됩니다.`;
          return;
        }
        statusEl.textContent =
          `구독이 시작되었습니다.\n\n플랜: ${data.user.plan.name}\n만료: ${data.user.subscription.expiresAt || '-'}\n만료일에 같은 플랜으로 자동 결제됩니다.\n\n확장프로그램 [설정] 탭을 다시 열면 자동 반영됩니다.\n이 창은 닫아도 됩니다.`;
      })
      .catch((err) => {
        statusEl.className = 'card error';
        statusEl.textContent = err.message || String(err);
      });
  </script>
</body>
</html>
