<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구독 결제</title>
  <script src="https://js.tosspayments.com/v1/payment"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #222;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .sub { color: #666; margin-bottom: 20px; }
    .plans { display: grid; gap: 12px; }
    .plan {
      background: #fff;
      border: 1px solid #e5e7ef;
      border-radius: 12px;
      padding: 16px;
    }
    .plan.current { border-color: #03c75a; background: #f6fffa; }
    .plan h2 { margin: 0 0 6px; font-size: 18px; }
    .price { font-size: 22px; font-weight: 700; margin: 8px 0; }
    .meta { color: #666; font-size: 13px; line-height: 1.5; }
    button {
      margin-top: 12px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #03c75a;
      color: #fff;
    }
    button.secondary { background: #eef1f6; color: #333; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 16px; padding: 12px; border-radius: 10px; background: #fff; border: 1px solid #e5e7ef; white-space: pre-wrap; }
    .status.error { border-color: #ffb4b4; background: #fff5f5; color: #b00020; }
    .legal {
      margin: 16px 0;
      padding: 14px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e5e7ef;
      font-size: 13px;
      line-height: 1.6;
      color: #444;
    }
    .legal label { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; cursor: pointer; }
    .legal input { width: auto; margin-top: 3px; }
    .panel {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e5e7ef;
    }
    .panel h3 { margin: 0 0 10px; font-size: 15px; }
    .history-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f2f6;
      font-size: 13px;
    }
    .history-item:last-child { border-bottom: 0; }
    .history-meta { color: #666; font-size: 12px; margin-top: 2px; }
    .toolbar-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .toolbar-row button { width: auto; min-width: 140px; margin-top: 0; }

    .sub-manage {
      display: grid;
      gap: 14px;
    }
    .sub-summary {
      display: grid;
      gap: 6px;
      font-size: 13px;
      line-height: 1.5;
      color: #444;
    }
    .sub-summary .plan-name {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }
    .sub-summary .muted { color: #6b7280; }
    .sub-summary .pending {
      color: #9a6700;
      background: #fff8e8;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .pay-card {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1.68 / 1;
      border-radius: 16px;
      padding: 18px 20px;
      color: #f8fafc;
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,0.18), transparent 55%),
        linear-gradient(145deg, #1e293b 0%, #0f172a 55%, #334155 100%);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.28);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .pay-card::before {
      content: '';
      position: absolute;
      right: -40px;
      top: -50px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }
    .pay-card::after {
      content: '';
      position: absolute;
      right: 24px;
      bottom: -60px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(3, 199, 90, 0.18);
    }
    .pay-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }
    .pay-card-brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0.95;
    }
    .pay-card-chip {
      width: 36px;
      height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, #f6e7b4, #d4b56a 45%, #c9a227);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
    }
    .pay-card-number {
      position: relative;
      z-index: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(15px, 4.2vw, 20px);
      letter-spacing: 0.08em;
      font-weight: 600;
      margin: 8px 0 4px;
    }
    .pay-card-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      font-size: 12px;
      opacity: 0.9;
    }
    .pay-card-empty {
      opacity: 0.85;
      font-size: 14px;
      line-height: 1.45;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>스마트스토어 답글 구독</h1>
    <div class="sub">로그인하면 답글 20건·말투 분석 1회를 계정마다 한 번 무료로 써볼 수 있습니다. 신규 구독은 토스페이먼츠 카드 자동결제 등록(만료일 자동 갱신). 업그레이드는 차액만 결제(만료일 유지). 낮은 플랜은 만료일부터 전환 예약. 취소하면 자동결제가 중단되고 만료일까지 이용 가능합니다.</div>
    <div class="legal" id="legalBox">
      <strong>정기결제 안내</strong>
      <div id="legalText" style="margin:8px 0;">불러오는 중…</div>
      <label><input id="legalAgree" type="checkbox" /> 위 정기결제 조건에 동의합니다. (<a href="/billing-terms.html" target="_blank" rel="noopener">자세히</a>)</label>
    </div>
    <div class="status" id="status">불러오는 중…</div>
    <div class="plans" id="plans"></div>
    <div class="panel" id="accountPanel" hidden>
      <h3>내 구독 관리</h3>
      <div id="accountPanelBody"></div>
      <div class="toolbar-row">
        <button id="cardUpdateBtn" class="secondary" type="button" hidden>결제 수단 변경</button>
        <button id="clearPendingBtn" class="secondary" type="button" hidden>다운그레이드 예약 취소</button>
      </div>
    </div>
    <div class="panel" id="historyPanel" hidden>
      <h3>결제 내역</h3>
      <div id="historyList"></div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const initialPlan = params.get('plan') || 'standard';
    const statusEl = document.getElementById('status');
    const plansEl = document.getElementById('plans');
    const legalAgree = document.getElementById('legalAgree');
    const legalText = document.getElementById('legalText');
    const accountPanel = document.getElementById('accountPanel');
    const accountPanelBody = document.getElementById('accountPanelBody');
    const cardUpdateBtn = document.getElementById('cardUpdateBtn');
    const clearPendingBtn = document.getElementById('clearPendingBtn');
    const historyPanel = document.getElementById('historyPanel');
    const historyList = document.getElementById('historyList');

    if (token) sessionStorage.setItem('billingToken', token);

    let checkoutBusy = false;
    let billingConfig = null;
    let currentSub = null;

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', !!isError);
      statusEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function highlightLegalBox(on) {
      const box = document.getElementById('legalBox');
      if (!box) return;
      box.style.borderColor = on ? '#f59e0b' : '#e5e7ef';
      box.style.background = on ? '#fffbeb' : '#fff';
    }

    function requireLegalConsent() {
      if (!legalAgree?.checked) {
        highlightLegalBox(true);
        setStatus('정기결제 안내에 동의 체크가 필요합니다.', true);
        legalAgree?.focus();
        return false;
      }
      highlightLegalBox(false);
      return true;
    }

    function renderLegalNotice(config) {
      const notice = config.legalNotice || {};
      legalText.innerHTML = [
        `· 결제 주기: <strong>${config.subscriptionDays || 30}일</strong> (만료일 자동 갱신)`,
        `· 플랜 변경: 업그레이드는 즉시(차액) · 다운그레이드는 만료일부터 예약`,
        `· 갱신 실패: ${notice.retryPolicy || '재시도 후 해지'}`,
        `· 구독 취소: ${notice.cancelMethod || '확장 [설정] → [구독 취소]'}`,
        config.productionReady
          ? '· <strong>실결제 모드</strong> (토스페이먼츠)'
          : config.mockMode
            ? '· <strong>테스트 모드</strong> (BILLING_MOCK)'
            : '· 결제 설정 필요 (TOSS 키 또는 BILLING_MOCK)',
      ].join('<br />');
    }

    async function loadPaymentHistory() {
      try {
        const data = await api('/api/billing/history');
        const rows = data.history || [];
        if (!rows.length) {
          historyPanel.hidden = false;
          historyList.innerHTML = '<div class="meta">결제 내역이 없습니다.</div>';
          return;
        }
        historyPanel.hidden = false;
        historyList.innerHTML = rows
          .map(
            (row) => `
              <div class="history-item">
                <div>
                  <div><strong>${row.kindLabel || row.kind}</strong> · ${row.planName || row.planId}</div>
                  <div class="history-meta">${row.paidAt || '-'} · ${row.orderName || ''}</div>
                </div>
                <div><strong>${Number(row.amount || 0).toLocaleString()}원</strong></div>
                ${row.status === 'refunded' ? '<div style="color:#b45309;font-size:11px;">환불됨</div>' : ''}
              </div>
            `
          )
          .join('');
      } catch (_) {
        historyPanel.hidden = true;
      }
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatCardNumberDisplay(number) {
      const raw = String(number || '').replace(/[^\d*]/g, '');
      if (!raw) return '';
      return (raw.match(/.{1,4}/g) || []).join('-');
    }

    function formatExpiresLocal(expiresAt) {
      const s = String(expiresAt || '').trim();
      if (!s) return '-';
      return s.replace('T', ' ').slice(0, 16);
    }

    function renderAccountPanel(sub, config) {
      if (!sub?.active) {
        accountPanel.hidden = true;
        cardUpdateBtn.hidden = true;
        clearPendingBtn.hidden = true;
        return;
      }
      accountPanel.hidden = false;

      const planName = escapeHtml(sub.planName || sub.planId || '플랜');
      const expires = escapeHtml(formatExpiresLocal(sub.expiresAt));
      const renewText = sub.pendingPlanId
        ? `만료일부터 ${escapeHtml(sub.pendingPlanName || sub.pendingPlanId)}로 전환·자동 결제`
        : sub.autoRenew
          ? '만료일에 같은 플랜으로 자동 결제'
          : '자동 갱신 꺼짐';
      const graceText = sub.renewalGrace ? ' · 결제 재시도 중' : '';
      const pendingHtml = sub.pendingPlanId
        ? `<div class="pending">다운그레이드 예약: ${escapeHtml(sub.planName || sub.planId)} → ${escapeHtml(sub.pendingPlanName || sub.pendingPlanId)} (만료까지 현재 플랜)</div>`
        : '';

      const company = escapeHtml(String(sub.cardCompany || '').trim() || '등록 카드');
      const numberDisplay = formatCardNumberDisplay(sub.cardNumber);
      const hasCard = !!(sub.cardCompany || sub.cardNumber || sub.cardLabel);
      const cardInner = hasCard
        ? `
          <div class="pay-card-top">
            <div class="pay-card-brand">${company}</div>
            <div class="pay-card-chip" aria-hidden="true"></div>
          </div>
          <div class="pay-card-number">${escapeHtml(numberDisplay || '···· ···· ···· ····')}</div>
          <div class="pay-card-bottom">
            <div>자동결제</div>
            <div>${escapeHtml(sub.planName || sub.planId || '')}</div>
          </div>
        `
        : `
          <div class="pay-card-top">
            <div class="pay-card-brand">결제 카드</div>
            <div class="pay-card-chip" aria-hidden="true"></div>
          </div>
          <div class="pay-card-empty">카드 정보가 아직 없어요.<br />아래에서 결제 수단을 변경하면 여기에 표시됩니다.</div>
        `;

      accountPanelBody.innerHTML = `
        <div class="sub-manage">
          <div class="sub-summary">
            <div class="plan-name">${planName}</div>
            <div class="muted">만료 ${expires}</div>
            <div class="muted">${renewText}${graceText}</div>
            ${pendingHtml}
          </div>
          <div class="pay-card" aria-label="등록된 결제 카드">${cardInner}</div>
        </div>
      `;

      const canUpdateCard =
        sub.status === 'active' &&
        !sub.cancelled &&
        (config.tossConfigured || config.mockMode);
      cardUpdateBtn.hidden = !canUpdateCard;
      clearPendingBtn.hidden = !(sub.pendingPlanId && !sub.cancelled);
    }

    function setPayButtonsDisabled(disabled) {
      plansEl.querySelectorAll('button[data-pay]').forEach((btn) => {
        btn.disabled = disabled ? true : btn.dataset.enabled !== '1';
      });
    }

    function isActivePaidSubscription(sub) {
      return !!sub?.active && sub?.status === 'active' && !sub?.cancelled;
    }

    function isCancelledPendingExpiry(sub) {
      return !!sub?.active && (sub?.cancelled || sub?.status === 'cancelled');
    }

    function findPlan(config, planId) {
      return (config.plans || []).find((p) => p.id === planId) || null;
    }

    function resolvePlanUi(plan, sub, config) {
      if (isCancelledPendingExpiry(sub)) {
        const isCurrent = plan.id === sub.planId;
        const current = findPlan(config, sub.planId);
        return {
          enabled: false,
          payLabel: isCurrent ? '현재 플랜 (만료까지)' : '만료 후 선택',
          mockLabel: isCurrent ? '현재 플랜 (만료까지)' : '만료 후 선택',
          note: isCurrent
            ? `${current?.name || plan.name} · ${sub.expiresAt || '-'}까지 이용`
            : '만료일 이후에 선택할 수 있습니다.',
          priceLabel: `${plan.price.toLocaleString()}원 / 30일`,
          current: isCurrent,
        };
      }

      if (!sub?.active) {
        return {
          enabled: true,
          payLabel: `${plan.name} 결제하기`,
          mockLabel: `${plan.name} 테스트 결제`,
          note: '신규 구독 30일 · 만료일 자동 갱신',
          priceLabel: `${plan.price.toLocaleString()}원 / 30일`,
          current: false,
        };
      }

      const current = findPlan(config, sub.planId);
      const currentRank = current?.rank || 0;
      if (plan.id === sub.planId) {
        return {
          enabled: false,
          payLabel: '현재 플랜',
          mockLabel: '현재 플랜',
          note: '지금 이용 중인 플랜입니다.',
          priceLabel: `${plan.price.toLocaleString()}원 / 30일`,
          current: true,
        };
      }
      if (plan.rank < currentRank) {
        if (sub.pendingPlanId === plan.id) {
          return {
            enabled: false,
            payLabel: '전환 예약됨',
            mockLabel: '전환 예약됨',
            note: `만료일(${sub.expiresAt || '-'})부터 ${plan.name} · 그전까지 현재 플랜 유지`,
            priceLabel: `${plan.price.toLocaleString()}원 / 30일`,
            current: false,
          };
        }
        if (!sub.autoRenew) {
          return {
            enabled: false,
            payLabel: '다운그레이드 불가',
            mockLabel: '다운그레이드 불가',
            note: '자동결제가 꺼져 있습니다. 구독 취소 후 만료일에 다시 구독하세요.',
            priceLabel: `${plan.price.toLocaleString()}원 / 30일`,
            current: false,
          };
        }
        return {
          enabled: true,
          payLabel: `만료일부터 ${plan.name}로 예약`,
          mockLabel: `만료일부터 ${plan.name}로 예약`,
          note: `${current?.name || '현재 플랜'} → ${plan.name} · 만료까지 현재 플랜 유지`,
          priceLabel: `다음 결제 ${plan.price.toLocaleString()}원`,
          current: false,
        };
      }

      const amount = plan.price - (current?.price || 0);
      return {
        enabled: true,
        payLabel: `업그레이드 (+${amount.toLocaleString()}원)`,
        mockLabel: `업그레이드 테스트 (+${amount.toLocaleString()}원)`,
        note: `${current?.name || '현재 플랜'} → ${plan.name} · 만료일 유지`,
        priceLabel: `차액 ${amount.toLocaleString()}원`,
        current: false,
      };
    }

    function updateStatusForSub(sub, config) {
      if (isCancelledPendingExpiry(sub)) {
        const current = findPlan(config, sub.planId);
        setStatus(
          `구독 취소 예약 · ${current?.name || sub.planName || sub.planId} (만료: ${sub.expiresAt || '-'})\n` +
            '만료일까지 현재 플랜을 이용할 수 있습니다. 자동 결제는 중단되었습니다.\n' +
            '다른 플랜(다운그레이드 포함)은 만료 후 [구독하기]에서 선택하세요.\n' +
            '취소를 되돌리려면 확장 [설정] → [취소 철회]를 눌러 주세요.'
        );
        return;
      }

      if (isActivePaidSubscription(sub)) {
        const current = findPlan(config, sub.planId);
        const hasUpgrade = (config.plans || []).some((p) => p.rank > (current?.rank || 0));
        if (sub.pendingPlanId) {
          setStatus(
            `현재 ${current?.name || sub.planName} 플랜 (만료: ${sub.expiresAt || '-'})\n` +
              `다운그레이드 예약: → ${sub.pendingPlanName || sub.pendingPlanId}\n` +
              '만료일까지 현재 플랜을 이용하고, 다음 자동결제부터 예약 플랜으로 전환됩니다.\n' +
              '예약을 취소하려면 [다운그레이드 예약 취소]를 누르세요.'
          );
          return;
        }
        const renewLine = sub.autoRenew ? '만료일에 같은 플랜으로 자동 결제됩니다.' : '';
        if (hasUpgrade) {
          setStatus(
            `현재 ${current?.name || sub.planName} 플랜 (만료: ${sub.expiresAt || '-'})\n` +
              `${renewLine ? renewLine + '\n' : ''}` +
              '더 높은 플랜은 차액 결제로 즉시 업그레이드, 낮은 플랜은 만료일부터 전환 예약할 수 있습니다.'
          );
        } else {
          setStatus(
            `현재 ${current?.name || sub.planName} 최고 플랜을 이용 중입니다. (만료: ${sub.expiresAt || '-'})\n` +
              `${renewLine ? renewLine + '\n' : ''}` +
              '낮은 플랜은 만료일부터 전환되도록 예약할 수 있습니다.'
          );
        }
        return;
      }

      if (config.productionReady) {
        setStatus('원하는 플랜의 결제하기를 누르세요. 카드 등록·결제는 토스페이먼츠에서 진행됩니다.');
      } else if (config.mockMode && !config.tossConfigured) {
        setStatus('테스트 모드입니다. 아래 「테스트 결제」 버튼을 누르세요.\n(실결제: Railway에 TOSS 키 + BILLING_MOCK=false)');
      } else if (config.mockMode) {
        setStatus('테스트 결제 또는 실제 토스 결제 중 선택하세요.');
      } else if (config.tossConfigured) {
        setStatus('원하는 플랜의 결제하기를 누르세요.');
      } else {
        setStatus('server/.env 에 BILLING_MOCK=true 또는 TOSS_CLIENT_KEY 를 설정한 뒤 서버를 재시작하세요.', true);
      }
    }

    async function api(path, options = {}) {
      const authToken = sessionStorage.getItem('billingToken') || token;
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (authToken) headers.Authorization = `Bearer ${authToken}`;
      const response = await fetch(path, {
        method: options.method || 'GET',
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
      const raw = await response.text();
      let data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch (_) {}
      if (!response.ok || data.ok === false) {
        throw new Error(data.error || `요청 실패 (${response.status})`);
      }
      return data;
    }

    function renderPlans(config, sub) {
      plansEl.innerHTML = '';
      const tossReady = !!config.tossConfigured && !!config.productionReady;
      const mockReady = !!config.mockMode;

      (config.plans || []).forEach((plan) => {
        const ui = resolvePlanUi(plan, sub, config);
        const card = document.createElement('div');
        card.className = ui.current ? 'plan current' : 'plan';
        card.innerHTML = `
          <h2>${plan.name}${ui.current ? ' · 이용 중' : ''}</h2>
          <div class="price">${ui.priceLabel}</div>
          <div class="meta">답글 ${plan.replyLimit}건 · 말투 분석 ${plan.toneLimit}회 / 월${ui.note ? `<br />${ui.note}` : ''}</div>
        `;

        if (tossReady) {
          const payBtn = document.createElement('button');
          payBtn.type = 'button';
          payBtn.dataset.pay = '1';
          payBtn.dataset.enabled = ui.enabled ? '1' : '0';
          payBtn.disabled = !ui.enabled;
          payBtn.textContent = ui.payLabel;
          if (ui.enabled) payBtn.addEventListener('click', () => startCheckout(plan.id, config));
          card.appendChild(payBtn);
        }

        if (mockReady) {
          const mockBtn = document.createElement('button');
          mockBtn.type = 'button';
          mockBtn.dataset.pay = '1';
          mockBtn.dataset.enabled = ui.enabled ? '1' : '0';
          mockBtn.disabled = !ui.enabled;
          mockBtn.className = tossReady ? 'secondary' : '';
          mockBtn.textContent = ui.mockLabel;
          if (ui.enabled) {
            mockBtn.addEventListener('click', () => mockCheckout(plan.id, mockBtn));
          }
          card.appendChild(mockBtn);
        }

        if (!tossReady && !mockReady) {
          const hint = document.createElement('div');
          hint.className = 'meta';
          hint.textContent = '결제 설정이 없습니다. server/.env 에 BILLING_MOCK=true 또는 TOSS_CLIENT_KEY 를 설정하세요.';
          card.appendChild(hint);
        }

        plansEl.appendChild(card);
      });
    }

    async function refreshBillingView() {
      const config = billingConfig || (await api('/api/billing/config'));
      billingConfig = config;
      renderLegalNotice(config);
      let sub = null;
      try {
        const me = await api('/api/auth/me');
        sub = me.subscription || me.user?.subscription;
      } catch (err) {
        setStatus(
          (err.message || '로그인 확인 실패') +
            '\n\n확장 [설정]에서 다시 로그인한 뒤 [구독하기]를 눌러 주세요.',
          true
        );
      }
      currentSub = sub;
      renderPlans(config, sub);
      updateStatusForSub(sub, config);
      renderAccountPanel(sub, config);
      await loadPaymentHistory();
      return sub;
    }

    async function startCardUpdate(config) {
      if (checkoutBusy) return;
      checkoutBusy = true;
      try {
        setStatus('결제 수단 변경 준비 중…');
        if (config.mockMode && !config.tossConfigured) {
          await api('/api/billing/mock-card-update', { method: 'POST', body: {} });
          setStatus('결제 수단이 변경되었습니다. (테스트)');
          await refreshBillingView();
          return;
        }
        if (!config.tossConfigured) throw new Error('TOSS_CLIENT_KEY가 설정되지 않았습니다.');
        const data = await api('/api/billing/prepare-card-update', { method: 'POST', body: {} });
        const cardUpdate = data.cardUpdate;
        const tossPayments = TossPayments(cardUpdate.clientKey);
        await tossPayments.requestBillingAuth('카드', {
          customerKey: cardUpdate.customerKey,
          successUrl: cardUpdate.billingAuthSuccessUrl,
          failUrl: cardUpdate.failUrl,
        });
      } catch (err) {
        if (err?.code === 'USER_CANCEL') {
          setStatus('변경이 취소되었습니다.');
          return;
        }
        setStatus(err.message || String(err), true);
      } finally {
        checkoutBusy = false;
      }
    }

    async function startCheckout(planId, config) {
      if (checkoutBusy) return;
      try {
        if (!requireLegalConsent()) return;

        if (!config.tossConfigured) {
          if (config.mockMode) {
            await mockCheckout(planId);
            return;
          }
          throw new Error('TOSS_CLIENT_KEY가 없습니다. server/.env 에 BILLING_MOCK=true 를 넣고 서버를 재시작하세요.');
        }

        checkoutBusy = true;
        setPayButtonsDisabled(true);
        setStatus('결제 준비 중…');
        const data = await api('/api/billing/prepare', {
          method: 'POST',
          body: { planId, legalConsent: true },
        });
        const checkout = data.checkout;
        if (checkout.checkoutType === 'schedule_downgrade' || checkout.scheduled) {
          const sub = checkout.subscription || {};
          setStatus(
            `다운그레이드가 예약되었습니다.\n` +
              `현재 ${sub.planName || '-'} → 만료일부터 ${sub.pendingPlanName || checkout.planName}\n` +
              `만료: ${sub.expiresAt || '-'}\n` +
              '그전까지 현재 플랜을 그대로 이용합니다.\n\n확장프로그램 [설정] 탭을 다시 열면 반영됩니다.'
          );
          await refreshBillingView();
          return;
        }
        const tossPayments = TossPayments(checkout.clientKey);
        if (checkout.checkoutType === 'subscribe' && checkout.useBillingAuth) {
          await tossPayments.requestBillingAuth('카드', {
            customerKey: checkout.customerKey,
            successUrl: checkout.billingAuthSuccessUrl,
            failUrl: checkout.failUrl,
          });
        } else {
          await tossPayments.requestPayment('카드', {
            amount: checkout.amount,
            orderId: checkout.orderId,
            orderName: checkout.orderName,
            customerKey: checkout.customerKey,
            successUrl: checkout.successUrl,
            failUrl: checkout.failUrl,
          });
        }
      } catch (err) {
        if (err?.code === 'USER_CANCEL') {
          setStatus('결제가 취소되었습니다.');
          await refreshBillingView();
          return;
        }
        setStatus(err.message || String(err), true);
        try { await refreshBillingView(); } catch (_) {}
      } finally {
        checkoutBusy = false;
        setPayButtonsDisabled(false);
      }
    }

    async function mockCheckout(planId, clickedBtn) {
      if (checkoutBusy) {
        setStatus('결제 처리 중입니다. 잠시만 기다려 주세요.');
        return;
      }
      if (!requireLegalConsent()) return;

      checkoutBusy = true;
      setPayButtonsDisabled(true);
      const prevLabel = clickedBtn?.textContent;
      if (clickedBtn) clickedBtn.textContent = '처리 중…';
      try {
        setStatus('처리 중…');
        let result;
        const isSubscribe = !currentSub?.active;
        if (isSubscribe) {
          result = await api('/api/billing/mock-subscribe', {
            method: 'POST',
            body: { planId, legalConsent: true },
          });
        } else {
          const prepared = await api('/api/billing/prepare', {
            method: 'POST',
            body: { planId, legalConsent: true },
          });
          if (prepared.checkout?.checkoutType === 'schedule_downgrade' || prepared.checkout?.scheduled) {
            const sub = prepared.checkout.subscription || {};
            setStatus(
              `다운그레이드가 예약되었습니다.\n` +
                `현재 ${sub.planName || '-'} → 만료일부터 ${sub.pendingPlanName || prepared.checkout.planName}\n` +
                `만료: ${sub.expiresAt || '-'}\n` +
                '그전까지 현재 플랜을 그대로 이용합니다.\n\n확장프로그램 [설정] 탭을 다시 열면 반영됩니다.'
            );
            await refreshBillingView();
            return;
          }
          result = await api('/api/billing/mock-confirm', {
            method: 'POST',
            body: { orderId: prepared.checkout.orderId },
          });
        }
        if (result.scheduled || result.checkoutType === 'schedule_downgrade') {
          const sub = result.user?.subscription || {};
          setStatus(
            `다운그레이드가 예약되었습니다.\n` +
              `현재 ${result.user.plan.name} → 만료일부터 ${sub.pendingPlanName || '-'}\n` +
              `만료: ${sub.expiresAt || '-'}\n\n확장프로그램 [설정] 탭을 다시 열면 반영됩니다.`
          );
          await refreshBillingView();
          return;
        }
        const checkoutType = isSubscribe ? 'subscribe' : 'upgrade';
        const typeLabel =
          checkoutType === 'upgrade'
            ? '업그레이드 완료'
            : '구독 시작 (자동결제 등록)';
        setStatus(
          `${typeLabel}!\n플랜: ${result.user.plan.name}\n만료: ${result.user.subscription.expiresAt || '-'}\n만료일에 같은 플랜으로 자동 갱신됩니다.\n\n확장프로그램 [설정] 탭을 다시 열면 자동 반영됩니다.`
        );
        await refreshBillingView();
      } catch (err) {
        setStatus(err.message || String(err), true);
        try { await refreshBillingView(); } catch (_) {}
      } finally {
        checkoutBusy = false;
        setPayButtonsDisabled(false);
        if (clickedBtn && prevLabel) clickedBtn.textContent = prevLabel;
      }
    }

    legalAgree?.addEventListener('change', () => {
      if (legalAgree.checked) highlightLegalBox(false);
    });

    cardUpdateBtn?.addEventListener('click', () => {
      if (!billingConfig) return;
      startCardUpdate(billingConfig);
    });

    clearPendingBtn?.addEventListener('click', async () => {
      if (checkoutBusy) return;
      if (!window.confirm('다운그레이드 예약을 취소할까요?\n만료일에 지금 플랜으로 자동 갱신됩니다.')) return;
      checkoutBusy = true;
      try {
        await api('/api/billing/pending-plan/clear', { method: 'POST', body: {} });
        setStatus('다운그레이드 예약을 취소했습니다. 만료일에 현재 플랜으로 자동 갱신됩니다.');
        await refreshBillingView();
      } catch (err) {
        setStatus(err.message || String(err), true);
      } finally {
        checkoutBusy = false;
      }
    });

    async function init() {
      if (!token && !sessionStorage.getItem('billingToken')) {
        setStatus('로그인이 필요합니다.\n확장프로그램 [설정]에서 로그인한 뒤, [구독하기]를 다시 눌러 주세요.', true);
        return;
      }
      billingConfig = await api('/api/billing/config');
      await refreshBillingView();
      if (params.get('view') === 'manage') {
        accountPanel.hidden = false;
        accountPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      if (initialPlan && billingConfig.plans?.some((p) => p.id === initialPlan)) {
        const note = document.createElement('div');
        note.className = 'sub';
        note.textContent = `추천 플랜: ${initialPlan}`;
        plansEl.before(note);
      }
    }

    init().catch((err) => setStatus(err.message || String(err), true));
  </script>
</body>
</html>
