<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · 스마트스토어 AI 자동답글</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #222;
    }
    .wrap { max-width: 420px; margin: 0 auto; padding: 40px 16px 48px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .sub { color: #666; margin: 0 0 20px; font-size: 13px; line-height: 1.5; }
    .card {
      background: #fff;
      border: 1px solid #e5e7ef;
      border-radius: 12px;
      padding: 18px;
    }
    label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: #03c75a;
      color: #fff;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e5e7ef;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .status.error { border-color: #ffb4b4; background: #fff5f5; color: #b00020; }
    .links { margin-top: 16px; font-size: 13px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>이메일 로그인</h1>
    <p class="sub">
      심사용·웹 결제용 계정 로그인입니다. (카카오 로그인과 별도)<br />
      로그인 후 구독·결제 페이지로 이동합니다.
    </p>
    <div class="card">
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" placeholder="review@example.com" />
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="8자 이상" />
      <button id="loginBtn" type="button">로그인 후 결제로 이동</button>
      <div class="status" id="status">이메일과 비밀번호를 입력해 주세요.</div>
    </div>
    <div class="links">
      <a href="/billing.html">플랜·가격 보기</a> ·
      <a href="/billing-terms.html">구독·결제 안내</a> ·
      <a href="/privacy.html">개인정보 처리방침</a>
    </div>
  </div>
  <script>
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const statusEl = document.getElementById('status');

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', !!isError);
    }

    async function login() {
      const email = String(emailEl.value || '').trim();
      const password = String(passwordEl.value || '');
      if (!email || !password) {
        setStatus('이메일과 비밀번호를 입력해 주세요.', true);
        return;
      }
      loginBtn.disabled = true;
      setStatus('로그인 중…');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || `로그인 실패 (${res.status})`);
        }
        const token = data.token || data.session?.token;
        if (!token) throw new Error('로그인 토큰을 받지 못했습니다.');
        sessionStorage.setItem('billingToken', token);
        location.href = `/billing.html?token=${encodeURIComponent(token)}`;
      } catch (err) {
        setStatus(err.message || String(err), true);
      } finally {
        loginBtn.disabled = false;
      }
    }

    loginBtn.addEventListener('click', login);
    passwordEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
