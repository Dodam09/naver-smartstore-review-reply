<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
      font-size: 14px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .sub { color: #6b7280; margin-bottom: 20px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .stat {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
    }
    .stat-label { color: #6b7280; font-size: 12px; }
    .stat-value { font-size: 24px; font-weight: 700; margin-top: 4px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #111827;
      color: #fff;
    }
    button.secondary { background: #eef2f7; color: #111827; }
    button.success { background: #059669; }
    button.warn { background: #dc2626; }
    button.small { padding: 6px 10px; font-size: 12px; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 160px; }
    .row button { flex: 0 0 auto; min-width: 100px; }
    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      white-space: pre-wrap;
    }
    .status.error { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .hidden { display: none !important; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }
    th { color: #6b7280; font-size: 12px; font-weight: 700; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge.active { background: #dcfce7; color: #166534; }
    .badge.inactive { background: #f3f4f6; color: #6b7280; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .toolbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 12px; }
    .table-wrap { overflow-x: auto; }
    @media (max-width: 760px) {
      .row > * { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>관리자</h1>
    <div class="sub">유저·구독·사용량 관리</div>

    <section id="loginSection" class="card">
      <label for="adminSecret">관리자 비밀키 (ADMIN_SECRET)</label>
      <div class="row">
        <input id="adminSecret" type="password" placeholder="Railway ADMIN_SECRET 값" autocomplete="current-password" />
        <button id="loginBtn" type="button">입장</button>
      </div>
      <div class="status" id="loginStatus">Railway에 ADMIN_SECRET을 설정해야 사용할 수 있습니다.</div>
    </section>

    <section id="dashboardSection" class="hidden">
      <div class="card">
        <div class="toolbar">
          <div>
            <strong id="periodLabel">-</strong>
            <div class="sub" style="margin:0;">현재 월 사용량 기준</div>
          </div>
          <div class="actions">
            <button id="refreshBtn" class="secondary" type="button">새로고침</button>
            <button id="logoutBtn" class="secondary" type="button">나가기</button>
          </div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="stat-label">전체 유저</div>
            <div class="stat-value" id="statTotal">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">구독 중</div>
            <div class="stat-value" id="statActive">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <strong>유저 목록</strong>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>계정</th>
                <th>구독</th>
                <th>사용량</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
        <div class="status" id="dashboardStatus"></div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'smartstoreAdminSecret';
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const adminSecretInput = document.getElementById('adminSecret');
    const loginStatus = document.getElementById('loginStatus');
    const dashboardStatus = document.getElementById('dashboardStatus');
    const usersBody = document.getElementById('usersBody');
    const periodLabel = document.getElementById('periodLabel');
    const statTotal = document.getElementById('statTotal');
    const statActive = document.getElementById('statActive');

    let plans = [];
    let dashboardData = null;

    function getSecret() {
      return sessionStorage.getItem(STORAGE_KEY) || '';
    }

    function setSecret(secret) {
      if (secret) sessionStorage.setItem(STORAGE_KEY, secret);
      else sessionStorage.removeItem(STORAGE_KEY);
    }

    function setLoginStatus(message, isError) {
      loginStatus.textContent = message;
      loginStatus.classList.toggle('error', !!isError);
    }

    function setDashboardStatus(message, isError) {
      dashboardStatus.textContent = message || '';
      dashboardStatus.classList.toggle('error', !!isError);
    }

    async function adminApi(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'X-Admin-Secret': getSecret(),
        ...(options.headers || {}),
      };
      const response = await fetch(path, {
        method: options.method || 'GET',
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
      const raw = await response.text();
      let data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch (_) {}
      if (!response.ok || data.ok === false) {
        throw new Error(data.error || `요청 실패 (${response.status})`);
      }
      return data;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function planOptions(selectedPlanId) {
      return plans
        .map(
          (plan) =>
            `<option value="${escapeHtml(plan.id)}" ${plan.id === selectedPlanId ? 'selected' : ''}>${escapeHtml(plan.name)}</option>`
        )
        .join('');
    }

    function renderUsers() {
      if (!dashboardData?.users?.length) {
        usersBody.innerHTML = '<tr><td colspan="5">등록된 유저가 없습니다.</td></tr>';
        return;
      }

      usersBody.innerHTML = dashboardData.users
        .map((user) => {
          const accountLabel = user.displayName || user.email;
          const provider = user.authProvider === 'kakao' ? '카카오' : '이메일';
          const sub = user.subscription || {};
          const usage = user.usage || {};
          const subBadge = sub.active
            ? `<span class="badge active">구독 중</span>`
            : `<span class="badge inactive">구독 전</span>`;
          const usageText = sub.active
            ? `답글 ${usage.replyUsed}/${usage.replyLimit} · 말투 ${usage.toneUsed}/${usage.toneLimit}`
            : '-';
          const statusLine = sub.active
            ? `만료 ${escapeHtml(sub.expiresAt || '-')}`
            : '아직 결제·활성화 전';
          const planLine = sub.active
            ? `적용 플랜: ${escapeHtml(sub.planName || user.planName || '-')}`
            : `가입 플랜: ${escapeHtml(user.planName || user.planId || '-')} (미적용)`;

          return `
            <tr data-user-id="${user.id}">
              <td class="mono">${user.id}</td>
              <td>
                <div><strong>${escapeHtml(accountLabel)}</strong></div>
                <div class="mono">${escapeHtml(user.email)}</div>
                <div>${provider}${user.kakaoId ? ` · kakao ${escapeHtml(user.kakaoId)}` : ''}</div>
                <div style="color:#6b7280;margin-top:4px;">가입 ${escapeHtml(user.createdAt || '-')}</div>
              </td>
              <td>
                ${subBadge}
                <div style="margin-top:6px;">${planLine}</div>
                <div>${statusLine}</div>
              </td>
              <td>${escapeHtml(usageText)}</td>
              <td style="min-width:220px;">
                <label>활성화할 플랜</label>
                <select class="plan-select">${planOptions(user.planId)}</select>
                <label style="margin-top:8px;">구독 기간(일)</label>
                <input class="days-input" type="number" min="1" max="3650" value="30" />
                <div class="actions">
                  <button class="success small activate-btn" type="button">구독 활성화</button>
                  <button class="secondary small extend-btn" type="button">연장</button>
                  <button class="warn small deactivate-btn" type="button">해지</button>
                </div>
              </td>
            </tr>
          `;
        })
        .join('');
    }

    function bindUserActions() {
      usersBody.querySelectorAll('tr[data-user-id]').forEach((row) => {
        const userId = Number(row.dataset.userId);
        const planSelect = row.querySelector('.plan-select');
        const daysInput = row.querySelector('.days-input');

        row.querySelector('.activate-btn')?.addEventListener('click', () =>
          updateSubscription(userId, 'activate', planSelect.value, daysInput.value)
        );
        row.querySelector('.extend-btn')?.addEventListener('click', () =>
          updateSubscription(userId, 'activate', planSelect.value, daysInput.value)
        );
        row.querySelector('.deactivate-btn')?.addEventListener('click', () =>
          updateSubscription(userId, 'deactivate')
        );
      });
    }

    async function loadDashboard() {
      setDashboardStatus('불러오는 중…');
      const data = await adminApi('/api/admin/users');
      dashboardData = data;
      plans = data.plans || [];
      periodLabel.textContent = `기준 월: ${data.period || '-'}`;
      statTotal.textContent = String(data.stats?.totalUsers ?? 0);
      statActive.textContent = String(data.stats?.activeSubscriptions ?? 0);
      renderUsers();
      bindUserActions();
      setDashboardStatus('');
    }

    async function updateSubscription(userId, action, planId, days) {
      try {
        setDashboardStatus('저장 중…');
        await adminApi(`/api/admin/users/${userId}/subscription`, {
          method: 'PATCH',
          body: {
            action,
            planId,
            days: Number(days) || 30,
          },
        });
        await loadDashboard();
        setDashboardStatus('저장했습니다.');
      } catch (err) {
        setDashboardStatus(err.message || '저장에 실패했습니다.', true);
      }
    }

    function showDashboard(show) {
      loginSection.classList.toggle('hidden', show);
      dashboardSection.classList.toggle('hidden', !show);
    }

    async function tryEnter() {
      const secret = adminSecretInput.value.trim();
      if (!secret) {
        setLoginStatus('ADMIN_SECRET을 입력해 주세요.', true);
        return;
      }
      setSecret(secret);
      try {
        await loadDashboard();
        showDashboard(true);
        setLoginStatus('');
      } catch (err) {
        setSecret('');
        setLoginStatus(err.message || '입장에 실패했습니다.', true);
      }
    }

    document.getElementById('loginBtn').addEventListener('click', tryEnter);
    adminSecretInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') tryEnter();
    });
    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadDashboard().catch((err) => setDashboardStatus(err.message, true));
    });
    document.getElementById('logoutBtn').addEventListener('click', () => {
      setSecret('');
      adminSecretInput.value = '';
      showDashboard(false);
      setDashboardStatus('');
      setLoginStatus('로그아웃했습니다.');
    });

    (async function init() {
      try {
        const status = await fetch('/api/admin/status').then((r) => r.json());
        if (!status.configured) {
          setLoginStatus('서버에 ADMIN_SECRET이 설정되지 않았습니다. Railway Variables에 추가해 주세요.', true);
          document.getElementById('loginBtn').disabled = true;
          return;
        }
        if (getSecret()) {
          adminSecretInput.value = getSecret();
          await tryEnter();
        }
      } catch (err) {
        setLoginStatus(err.message || '상태 확인에 실패했습니다.', true);
      }
    })();
  </script>
</body>
</html>
