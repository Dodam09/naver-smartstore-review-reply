<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 · 스마트스토어 답글</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #111827;
      --green: #059669;
      --green-soft: #ecfdf5;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --shadow: 0 1px 2px rgba(17, 24, 39, 0.06), 0 8px 24px rgba(17, 24, 39, 0.04);
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 56px; }
    .page-head { margin-bottom: 20px; }
    .page-head h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
    .page-head p { margin: 0; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .login-card { max-width: 420px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
    }
    input:focus, select:focus {
      outline: 2px solid rgba(37, 99, 235, 0.25);
      border-color: #93c5fd;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: opacity 0.15s ease;
    }
    button:hover:not(:disabled) { opacity: 0.92; }
    button.secondary { background: #eef2f7; color: var(--text); }
    button.success { background: var(--green); }
    button.warn { background: var(--red); }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    button.small { padding: 7px 10px; font-size: 12px; border-radius: 8px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 160px; }
    .row button { flex: 0 0 auto; min-width: 96px; }
    .hidden { display: none !important; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .topbar-meta strong { display: block; font-size: 15px; }
    .topbar-meta span { color: var(--muted); font-size: 12px; }
    .topbar-actions { display: flex; gap: 8px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }
    .stat {
      background: #fafbfc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 14px 12px;
      position: relative;
      overflow: hidden;
    }
    .stat::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--line);
    }
    .stat.total::before { background: var(--accent); }
    .stat.active::before { background: var(--green); }
    .stat.paid::before { background: var(--blue); }
    .stat.cancelled::before { background: var(--amber); }
    .stat.renew::before { background: #7c3aed; }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { font-size: 28px; font-weight: 700; margin-top: 2px; letter-spacing: -0.03em; }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .panel-head h2 { margin: 0; font-size: 16px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .search-wrap { min-width: 220px; flex: 1; max-width: 320px; }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .user-list { display: grid; gap: 12px; }
    .user-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: #fff;
    }
    .user-card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .user-title { font-size: 15px; font-weight: 700; }
    .user-email { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
    .user-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .user-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1.3fr;
      gap: 14px;
      align-items: start;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .sub-line { font-size: 13px; color: #374151; }
    .sub-line + .sub-line { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.active { background: var(--green-soft); color: #047857; }
    .badge.cancelled { background: var(--amber-soft); color: #b45309; }
    .badge.inactive { background: #f3f4f6; color: var(--muted); }
    .badge.renew { background: #f5f3ff; color: #6d28d9; }

    .usage-block + .usage-block { margin-top: 10px; }
    .usage-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .usage-bar {
      height: 8px;
      background: #eef2f7;
      border-radius: 999px;
      overflow: hidden;
    }
    .usage-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #34d399, #059669);
    }
    .usage-fill.warn { background: linear-gradient(90deg, #fbbf24, #d97706); }
    .usage-fill.danger { background: linear-gradient(90deg, #f87171, #dc2626); }

    .admin-box {
      border: 1px dashed #d1d5db;
      border-radius: 10px;
      padding: 10px;
      background: #fafbfc;
    }
    .admin-row { display: grid; grid-template-columns: 1fr 88px; gap: 8px; }
    .admin-row + .admin-row { margin-top: 8px; }
    .action-groups { display: grid; gap: 8px; margin-top: 10px; }
    .action-group-label { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .empty {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: #fafbfc;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      min-width: 240px;
      max-width: 90vw;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 600;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    .toast.error { background: var(--red); }
    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f9fafb;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      font-size: 13px;
    }
    .status.error { background: var(--red-soft); border-color: #fecaca; color: #b91c1c; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    @media (max-width: 920px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .user-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .stats { grid-template-columns: 1fr; }
      .row > * { min-width: 100%; }
      .search-wrap { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <h1>관리자</h1>
      <p>유저 · 구독 · 자동결제 · 사용량</p>
    </div>

    <section id="loginSection" class="card login-card">
      <label for="adminSecret">관리자 비밀키</label>
      <div class="row">
        <input id="adminSecret" type="password" placeholder="ADMIN_SECRET" autocomplete="current-password" />
        <button id="loginBtn" type="button">입장</button>
      </div>
      <div class="status" id="loginStatus">Railway Variables에 ADMIN_SECRET을 설정해야 합니다.</div>
    </section>

    <section id="dashboardSection" class="hidden">
      <div class="topbar">
        <div class="topbar-meta">
          <strong id="periodLabel">-</strong>
          <span>월간 사용량 기준 · 자동갱신 15분 주기</span>
        </div>
        <div class="topbar-actions">
          <button id="refreshBtn" class="secondary" type="button">새로고침</button>
          <button id="logoutBtn" class="ghost" type="button">나가기</button>
        </div>
      </div>

      <div class="card">
        <div class="stats">
          <div class="stat total">
            <div class="stat-label">전체 유저</div>
            <div class="stat-value" id="statTotal">0</div>
          </div>
          <div class="stat active">
            <div class="stat-label">이용 가능</div>
            <div class="stat-value" id="statActive">0</div>
          </div>
          <div class="stat paid">
            <div class="stat-label">구독 중</div>
            <div class="stat-value" id="statPaidActive">0</div>
          </div>
          <div class="stat cancelled">
            <div class="stat-label">취소 예약</div>
            <div class="stat-value" id="statCancelled">0</div>
          </div>
          <div class="stat renew">
            <div class="stat-label">자동 갱신</div>
            <div class="stat-value" id="statAutoRenew">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="panel-head">
          <h2>유저 목록</h2>
          <div class="filters">
            <div class="search-wrap">
              <input id="searchInput" type="search" placeholder="이름 · 이메일 · ID 검색" />
            </div>
            <button class="chip active" type="button" data-filter="all">전체</button>
            <button class="chip" type="button" data-filter="paid">구독 중</button>
            <button class="chip" type="button" data-filter="renew">자동 갱신</button>
            <button class="chip" type="button" data-filter="cancelled">취소 예약</button>
            <button class="chip" type="button" data-filter="inactive">만료/미구독</button>
          </div>
        </div>
        <div class="user-list" id="usersBody"></div>
      </div>

      <div class="card">
        <div class="panel-head">
          <h2>최근 결제</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>일시</th>
                <th>유저</th>
                <th>종류</th>
                <th>플랜</th>
                <th>금액</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'smartstoreAdminSecret';
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const adminSecretInput = document.getElementById('adminSecret');
    const loginStatus = document.getElementById('loginStatus');
    const usersBody = document.getElementById('usersBody');
    const ordersBody = document.getElementById('ordersBody');
    const periodLabel = document.getElementById('periodLabel');
    const statTotal = document.getElementById('statTotal');
    const statActive = document.getElementById('statActive');
    const statPaidActive = document.getElementById('statPaidActive');
    const statCancelled = document.getElementById('statCancelled');
    const statAutoRenew = document.getElementById('statAutoRenew');
    const searchInput = document.getElementById('searchInput');
    const toastEl = document.getElementById('toast');

    let plans = [];
    let dashboardData = null;
    let activeFilter = 'all';
    let toastTimer = null;

    function getSecret() {
      return sessionStorage.getItem(STORAGE_KEY) || '';
    }

    function setSecret(secret) {
      if (secret) sessionStorage.setItem(STORAGE_KEY, secret);
      else sessionStorage.removeItem(STORAGE_KEY);
    }

    function setLoginStatus(message, isError) {
      loginStatus.textContent = message;
      loginStatus.classList.toggle('error', !!isError);
    }

    function showToast(message, isError) {
      toastEl.textContent = message;
      toastEl.classList.toggle('error', !!isError);
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    async function adminApi(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'X-Admin-Secret': getSecret(),
        ...(options.headers || {}),
      };
      const response = await fetch(path, {
        method: options.method || 'GET',
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
      const raw = await response.text();
      let data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch (_) {}
      if (!response.ok || data.ok === false) {
        throw new Error(data.error || `요청 실패 (${response.status})`);
      }
      return data;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function planOptions(selectedPlanId) {
      return plans
        .map(
          (plan) =>
            `<option value="${escapeHtml(plan.id)}" ${plan.id === selectedPlanId ? 'selected' : ''}>${escapeHtml(plan.name)} (${plan.price.toLocaleString()}원)</option>`
        )
        .join('');
    }

    function usagePercent(used, limit) {
      if (!limit) return 0;
      return Math.min(100, Math.round((Number(used || 0) / limit) * 100));
    }

    function usageBarClass(percent) {
      if (percent >= 90) return 'danger';
      if (percent >= 70) return 'warn';
      return '';
    }

    function renderUsage(label, used, limit) {
      const percent = usagePercent(used, limit);
      return `
        <div class="usage-block">
          <div class="usage-head"><span>${label}</span><span>${used}/${limit} (${percent}%)</span></div>
          <div class="usage-bar"><div class="usage-fill ${usageBarClass(percent)}" style="width:${percent}%"></div></div>
        </div>
      `;
    }

    function describeSubscription(sub, billingKeyRegistered) {
      if (!sub?.active) {
        return {
          badge: `<span class="badge inactive">만료 / 미구독</span>`,
          lines: ['유료 플랜 없음', '결제 또는 관리자 활성화 필요'],
        };
      }
      if (sub.status === 'cancelled' || sub.cancelled) {
        return {
          badge: `<span class="badge cancelled">취소 예약</span>`,
          lines: [
            `${sub.planName || sub.planId} · ${sub.expiresAt || '-'}까지`,
            '자동결제 중단 · 만료 후 재구독',
          ],
        };
      }
      const renewBadge = sub.autoRenew
        ? `<span class="badge renew">자동 갱신</span>`
        : billingKeyRegistered
          ? `<span class="badge inactive">갱신 꺼짐</span>`
          : '';
      return {
        badge: `<span class="badge active">구독 중</span> ${renewBadge}`,
        lines: [
          `${sub.planName || sub.planId} · 만료 ${sub.expiresAt || '-'}`,
          sub.autoRenew ? '만료일에 같은 플랜 자동 결제' : '수동 재구독 필요',
        ],
      };
    }

    function matchesFilter(user, sub) {
      if (activeFilter === 'all') return true;
      if (activeFilter === 'paid') {
        return sub?.active && sub.status === 'active' && !sub.cancelled;
      }
      if (activeFilter === 'renew') return !!(sub?.active && sub.autoRenew);
      if (activeFilter === 'cancelled') {
        return !!(sub?.active && (sub.cancelled || sub.status === 'cancelled'));
      }
      if (activeFilter === 'inactive') return !sub?.active;
      return true;
    }

    function matchesSearch(user, query) {
      if (!query) return true;
      const hay = [
        user.id,
        user.email,
        user.displayName,
        user.kakaoId,
        user.planName,
        user.subscription?.planId,
      ]
        .filter(Boolean)
        .join(' ')
        .toLowerCase();
      return hay.includes(query);
    }

    function renderActionButtons(sub) {
      const isActive = !!sub?.active;
      const isCancelled = !!(sub?.cancelled || sub.status === 'cancelled');
      const isPaidActive = isActive && !isCancelled && sub.status === 'active';

      const statusActions = [];
      if (isPaidActive) statusActions.push('<button class="warn small cancel-btn" type="button">취소 예약</button>');
      if (isActive && isCancelled) statusActions.push('<button class="secondary small undo-cancel-btn" type="button">취소 철회</button>');
      if (isActive) statusActions.push('<button class="secondary small change-plan-btn" type="button">플랜 변경</button>');
      statusActions.push('<button class="warn small deactivate-btn" type="button">즉시 해지</button>');

      return `
        <div class="action-groups">
          <div>
            <div class="action-group-label">구독</div>
            <div class="actions">
              <button class="success small activate-btn" type="button">활성화</button>
              <button class="secondary small extend-btn" type="button">연장</button>
            </div>
          </div>
          <div>
            <div class="action-group-label">상태</div>
            <div class="actions">${statusActions.join('')}</div>
          </div>
        </div>
      `;
    }

    function orderKindLabel(kind) {
      const map = {
        subscribe: '신규 구독',
        upgrade: '업그레이드',
        renewal: '자동 갱신',
        card_update: '카드 변경',
        payment: '결제',
      };
      return map[kind] || kind || '결제';
    }

    function renderRecentOrders() {
      const rows = dashboardData?.recentOrders || [];
      if (!rows.length) {
        ordersBody.innerHTML = '<tr><td colspan="5">결제 내역이 없습니다.</td></tr>';
        return;
      }
      ordersBody.innerHTML = rows
        .map(
          (row) => `
            <tr>
              <td class="mono">${escapeHtml(row.paidAt || '-')}</td>
              <td>
                <div>${escapeHtml(row.displayName || row.email || `#${row.userId}`)}</div>
                <div class="mono" style="color:#6b7280;font-size:12px;">${escapeHtml(row.email || '')}</div>
              </td>
              <td>${escapeHtml(orderKindLabel(row.kind))}</td>
              <td>${escapeHtml(row.planName || row.planId || '-')}</td>
              <td><strong>${Number(row.amount || 0).toLocaleString()}원</strong></td>
            </tr>
          `
        )
        .join('');
    }

    function renderUsers() {
      const query = String(searchInput.value || '').trim().toLowerCase();
      const users = (dashboardData?.users || []).filter((user) => {
        const sub = user.subscription || {};
        return matchesFilter(user, sub) && matchesSearch(user, query);
      });

      if (!dashboardData?.users?.length) {
        usersBody.innerHTML = '<div class="empty">등록된 유저가 없습니다.</div>';
        return;
      }
      if (!users.length) {
        usersBody.innerHTML = '<div class="empty">조건에 맞는 유저가 없습니다.</div>';
        return;
      }

      usersBody.innerHTML = users
        .map((user) => {
          const accountLabel = user.displayName || user.email;
          const provider = user.authProvider === 'kakao' ? '카카오' : '이메일';
          const sub = user.subscription || {};
          const usage = user.usage || {};
          const subInfo = describeSubscription(sub, user.billingKeyRegistered);
          const usageHtml = sub.active
            ? renderUsage('답글', usage.replyUsed, usage.replyLimit) +
              renderUsage('말투', usage.toneUsed, usage.toneLimit)
            : '<div class="sub-line">구독 없음</div>';

          return `
            <article class="user-card" data-user-id="${user.id}">
              <div class="user-card-head">
                <div>
                  <div class="user-title">${escapeHtml(accountLabel)} <span class="mono" style="color:#9ca3af;">#${user.id}</span></div>
                  <div class="user-email">${escapeHtml(user.email)}</div>
                  <div class="user-meta">${provider}${user.kakaoId ? ` · kakao ${escapeHtml(user.kakaoId)}` : ''} · 가입 ${escapeHtml(user.createdAt || '-')}</div>
                </div>
                <div>${subInfo.badge}</div>
              </div>
              <div class="user-grid">
                <div>
                  <div class="section-label">구독</div>
                  <div class="sub-line">${escapeHtml(subInfo.lines[0])}</div>
                  <div class="sub-line">${escapeHtml(subInfo.lines[1])}</div>
                </div>
                <div>
                  <div class="section-label">이번 달 사용량</div>
                  ${usageHtml}
                </div>
                <div>
                  <div class="section-label">관리</div>
                  <div class="admin-box">
                    <div class="admin-row">
                      <select class="plan-select">${planOptions(user.activationPlanId || user.planId || 'basic')}</select>
                      <input class="days-input" type="number" min="1" max="3650" value="30" title="일" />
                    </div>
                    ${renderActionButtons(sub)}
                  </div>
                </div>
              </div>
            </article>
          `;
        })
        .join('');
    }

    function bindUserActions() {
      usersBody.querySelectorAll('[data-user-id]').forEach((row) => {
        const userId = Number(row.dataset.userId);
        const planSelect = row.querySelector('.plan-select');
        const daysInput = row.querySelector('.days-input');

        row.querySelector('.activate-btn')?.addEventListener('click', () =>
          updateSubscription(userId, 'activate', planSelect.value, daysInput.value)
        );
        row.querySelector('.extend-btn')?.addEventListener('click', () =>
          updateSubscription(userId, 'activate', planSelect.value, daysInput.value)
        );
        row.querySelector('.cancel-btn')?.addEventListener('click', () => {
          if (!window.confirm('구독 취소를 예약할까요?\n만료일까지 이용 가능 · 자동결제 중단')) return;
          updateSubscription(userId, 'cancel');
        });
        row.querySelector('.undo-cancel-btn')?.addEventListener('click', () =>
          updateSubscription(userId, 'undo-cancel')
        );
        row.querySelector('.change-plan-btn')?.addEventListener('click', () => {
          if (!window.confirm('만료일 유지 · 선택 플랜으로 변경할까요?')) return;
          updateSubscription(userId, 'change-plan', planSelect.value);
        });
        row.querySelector('.deactivate-btn')?.addEventListener('click', () => {
          if (!window.confirm('즉시 해지하면 구독·만료일·자동결제가 모두 삭제됩니다.')) return;
          updateSubscription(userId, 'deactivate');
        });
      });
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll('.chip[data-filter]').forEach((chip) => {
        chip.classList.toggle('active', chip.dataset.filter === filter);
      });
      renderUsers();
      bindUserActions();
    }

    async function loadDashboard() {
      const data = await adminApi('/api/admin/users');
      dashboardData = data;
      plans = data.plans || [];
      periodLabel.textContent = `기준 월 ${data.period || '-'}`;
      statTotal.textContent = String(data.stats?.totalUsers ?? 0);
      statActive.textContent = String(data.stats?.activeSubscriptions ?? 0);
      statPaidActive.textContent = String(data.stats?.paidActiveSubscriptions ?? 0);
      statCancelled.textContent = String(data.stats?.cancelledPending ?? 0);
      statAutoRenew.textContent = String(data.stats?.autoRenewSubscriptions ?? 0);
      renderUsers();
      bindUserActions();
      renderRecentOrders();
    }
      try {
        const body = { action };
        if (planId) body.planId = planId;
        if (days != null && action !== 'cancel' && action !== 'undo-cancel' && action !== 'deactivate') {
          body.days = Number(days) || 30;
        }
        await adminApi(`/api/admin/users/${userId}/subscription`, {
          method: 'PATCH',
          body,
        });
        await loadDashboard();
        showToast('저장했습니다.');
      } catch (err) {
        showToast(err.message || '저장에 실패했습니다.', true);
      }
    }

    function showDashboard(show) {
      loginSection.classList.toggle('hidden', show);
      dashboardSection.classList.toggle('hidden', !show);
    }

    async function tryEnter() {
      const secret = adminSecretInput.value.trim();
      if (!secret) {
        setLoginStatus('ADMIN_SECRET을 입력해 주세요.', true);
        return;
      }
      setSecret(secret);
      try {
        await loadDashboard();
        showDashboard(true);
        setLoginStatus('');
      } catch (err) {
        setSecret('');
        setLoginStatus(err.message || '입장에 실패했습니다.', true);
      }
    }

    document.getElementById('loginBtn').addEventListener('click', tryEnter);
    adminSecretInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') tryEnter();
    });
    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadDashboard()
        .then(() => showToast('새로고침했습니다.'))
        .catch((err) => showToast(err.message, true));
    });
    document.getElementById('logoutBtn').addEventListener('click', () => {
      setSecret('');
      adminSecretInput.value = '';
      showDashboard(false);
      setLoginStatus('로그아웃했습니다.');
    });
    searchInput.addEventListener('input', () => {
      renderUsers();
      bindUserActions();
    });
    document.querySelectorAll('.chip[data-filter]').forEach((chip) => {
      chip.addEventListener('click', () => setFilter(chip.dataset.filter));
    });

    (async function init() {
      try {
        const status = await fetch('/api/admin/status').then((r) => r.json());
        if (!status.configured) {
          setLoginStatus('서버에 ADMIN_SECRET이 설정되지 않았습니다.', true);
          document.getElementById('loginBtn').disabled = true;
          return;
        }
        if (getSecret()) {
          adminSecretInput.value = getSecret();
          await tryEnter();
        }
      } catch (err) {
        setLoginStatus(err.message || '상태 확인에 실패했습니다.', true);
      }
    })();
  </script>
</body>
</html>
