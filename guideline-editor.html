<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지침 관리</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      color: #0f172a;
      background: #eef2f7;
      min-height: 100vh;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.05);
    }
    .header-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 18px 24px 14px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
    }
    h1 { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
    .sub { margin: 0; color: #64748b; font-size: 13px; line-height: 1.5; }
    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #0f172a;
    }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn-primary {
      border: none;
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .main {
      max-width: 880px;
      margin: 0 auto;
      padding: 18px 24px 40px;
    }
    .banner {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    .banner.visible { display: block; }
    .banner.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .banner.warn { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .banner.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .panel {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
    }
    .panel .guideline-items-list {
      max-height: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <div>
        <h1 id="pageTitle">지침 관리</h1>
        <p class="sub" id="pageSub">의미별로 나눠 수정·삭제하거나 새 지침을 추가한 뒤 저장하세요.</p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn" id="cancelBtn">닫기</button>
        <button type="button" class="btn btn-primary" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="banner" id="banner"></div>
    <div class="panel">
      <div id="editorHost"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="lib/tone-presets.js"></script>
  <script src="lib/guideline-items.js"></script>
  <script src="guideline-editor.js"></script>
</body>
</html>
