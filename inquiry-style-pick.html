<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품문의 답글 스타일 선택</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      color: #1a1a1a;
      background: #eef1f5;
      padding-bottom: 96px;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid #dde2e8;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 24px 16px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
    .sub { margin: 0; color: #666; font-size: 14px; line-height: 1.5; }
    .toolbar {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    select, .search {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
    }
    .search { flex: 1; min-width: 180px; }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: #333; border: 1px solid #ccc; }
    button.reload { background: #0369a1; color: #fff; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .stats {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stat {
      background: #fff;
      border: 1px solid #dde2e8;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
    }
    .stat strong { color: #0369a1; font-size: 18px; }
    .banner {
      max-width: 960px;
      margin: 0 auto 12px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .banner.info { background: #eef8f2; border: 1px solid #b8e6cc; color: #0a5c32; }
    .banner.warn { background: #fff4e5; border: 1px solid #f0d9a8; color: #9a6700; }
    .banner.error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .banner.success { background: #e8f4fd; border: 1px solid #b3d9f2; color: #0c4a6e; }
    .progress-panel {
      display: none;
      max-width: 960px;
      margin: 0 auto 14px;
      padding: 16px 18px;
      background: #fff;
      border: 1px solid #bae6fd;
      border-radius: 14px;
    }
    .progress-panel.visible { display: block; }
    .progress-steps {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .progress-step {
      flex: 1;
      min-width: 120px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
    }
    .progress-step.active { background: #e0f2fe; color: #0369a1; }
    .progress-step.done { background: #dcfce7; color: #166534; }
    .progress-track {
      height: 12px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #0284c7, #0ea5e9);
      border-radius: 999px;
      transition: width .25s ease;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      font-size: 13px;
      color: #334155;
    }
    .progress-pct { font-weight: 800; color: #0369a1; font-size: 18px; }
    .list {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      display: flex;
      gap: 12px;
      background: #fff;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .card.selected { border-color: #0369a1; box-shadow: 0 0 0 3px rgba(3,105,161,.12); }
    .card.disabled { opacity: .55; cursor: not-allowed; }
    .card-check { margin-top: 4px; width: 18px; height: 18px; flex-shrink: 0; accent-color: #0369a1; }
    .card-body { flex: 1; min-width: 0; }
    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .card-id { font-size: 12px; color: #888; font-weight: 700; }
    .product { font-size: 12px; color: #666; margin-bottom: 8px; }
    .q-label, .reply-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    .q-label { color: #475569; }
    .reply-label { color: #0369a1; }
    .q-text {
      font-size: 13px;
      line-height: 1.55;
      color: #334155;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .reply-text {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: #111;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .empty {
      text-align: center;
      padding: 64px 24px;
      color: #888;
      line-height: 1.6;
    }
    .footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #fff;
      border-top: 1px solid #dde2e8;
      box-shadow: 0 -4px 16px rgba(0,0,0,.08);
    }
    .footer-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .footer-inner .summary { flex: 1; min-width: 200px; font-size: 15px; }
    .footer-inner .summary strong { color: #0369a1; font-size: 20px; }
    .footer-inner .primary {
      background: #0369a1;
      color: #fff;
      font-size: 16px;
      padding: 14px 22px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>상품문의 응대 지침서</h1>
      <p class="sub">판매자센터의 기존 문의/답변을 불러와, 이 스토어가 실제로 어떻게 안내하는지를 지침서로 만듭니다. 목록을 불러오면 자동으로 시작합니다.</p>
    </div>
  </header>

  <div class="toolbar">
    <select id="daysSelect" aria-label="조회 기간"></select>
    <button type="button" class="reload" id="reloadBtn">답글 목록 불러오기</button>
    <input type="search" class="search" id="searchInput" placeholder="문의·답변·상품명 검색" />
    <button type="button" class="secondary" id="selectAllBtn">답변 있는 항목 전체 선택</button>
    <button type="button" class="secondary" id="clearBtn">선택 해제</button>
  </div>

  <div class="stats">
    <div class="stat">목록 <strong id="totalCount">0</strong>건</div>
    <div class="stat">답변 읽기 가능 <strong id="readableCount">0</strong>건</div>
    <div class="stat">선택 <strong id="selectedCount">0</strong>건</div>
  </div>

  <div class="banner info" id="banner">판매자센터 [상품문의] 탭을 연 뒤 [답글 목록 불러오기]를 누르세요.</div>

  <div class="progress-panel" id="progressPanel">
    <div class="progress-steps">
      <div class="progress-step" id="stepList">1 답변 불러오기</div>
      <div class="progress-step" id="stepAnalyze">2 지침서 작성</div>
      <div class="progress-step" id="stepDone">3 완료</div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-meta">
      <div id="progressLabel">준비 중</div>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
  </div>

  <main class="list" id="list"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="summary"><strong id="footerCount">0</strong>개 선택</div>
      <button type="button" class="primary" id="analyzeBtn" disabled>지침서 만들기</button>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="lib/ai-proxy.js"></script>
  <script src="lib/lookup-days.js"></script>
  <script src="lib/tone-presets.js"></script>
  <script src="lib/style-apply-confirm.js"></script>
  <script src="inquiry-style-pick.js"></script>
</body>
</html>
